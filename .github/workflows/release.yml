name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Myna
        run: python -m pip install myna-lang==0.5.0
      - name: Run tests
        run: python -m myna run tests/run_tests.myna
      - name: Build standalone bundle
        run: |
          mkdir -p dist
          python -m myna bundle src/main.myna --zipapp -o dist/mynapress.pyz
      - name: Verify bundle without Myna
        run: |
          python -m venv /tmp/bundle-venv
          /tmp/bundle-venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("myna") is None'
          /tmp/bundle-venv/bin/python dist/mynapress.pyz --version
          /tmp/bundle-venv/bin/python dist/mynapress.pyz --help > /dev/null
          rm -rf /tmp/bundle-build
          /tmp/bundle-venv/bin/python dist/mynapress.pyz build --config fixtures/site/site.toml --out /tmp/bundle-build
          test -f /tmp/bundle-build/index.html
      - name: Generate checksums
        run: cd dist && sha256sum mynapress.pyz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "MynaPress $TAG"
          gh release upload "$TAG" dist/mynapress.pyz dist/SHA256SUMS --clobber
          gh release view "$TAG"
